<!doctype html>
<meta charset="utf-8">
<title>Free My TV UI harness</title>
<style>html, body { margin: 0; } iframe { border: 0; width: 1920px; height: 1080px; display: block; }</style>
<pre id="result"></pre>
<script>
// One case per run (run.sh passes ?case=). Each case may seed localStorage (setup) before the real page loads in a
// same-origin iframe, then checks the page (check) and returns '' for a pass or the reason it failed.
var CASE = (location.search.match(/case=([a-z0-9-]+)/) || [])[1];
var DENVER = {latitude: 39.73915, longitude: -104.9847};

function pad(n) { return (n < 10 ? '0' : '') + n; }
/** Open-Meteo local time string for epoch ms at a fixed UTC offset (seconds). */
function meteoTime(ms, off) {
  var d = new Date(ms + off * 1000);
  return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()) + 'T' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes());
}
/** The Denver fixture with hourly times at now + 1h, + 2h, ... and today's sunrise and sunset at the given local times. */
function denverWeather(fixture, sunriseHM, sunsetHM) {
  var body = JSON.parse(JSON.stringify(fixture)), off = body.utc_offset_seconds;
  var hourMs = 3600000, now = Date.now(), top = Math.floor(now / hourMs) * hourMs;
  body.hourly.time = body.hourly.temperature_2m.map(function (_, k) { return meteoTime(top + (k + 1) * hourMs, off); });
  var today = meteoTime(now, off).slice(0, 10);
  body.daily.time = [today];
  body.daily.sunrise = [today + 'T' + (sunriseHM || '06:58')];
  body.daily.sunset = [today + 'T' + (sunsetHM || '16:40')];
  return body;
}
function seed(prefs, weatherBody) {
  localStorage.clear();
  var p = {latitude: DENVER.latitude, longitude: DENVER.longitude};
  for (var k in prefs) p[k] = prefs[k];
  localStorage.setItem('fmtv.prefs', JSON.stringify(p));
  if (weatherBody) {
    localStorage.setItem('fmtv.weather', JSON.stringify({place: DENVER.latitude + ',' + DENVER.longitude,
      body: weatherBody, at: Date.now(), query: null}));
  }
}

var CASES = {
  // Breaks if Outfit 300 or Geist 400 is not declared as a local @font-face the page can load.
  'fonts-loaded': {
    check: function (win, doc) {
      var want = [['300 96px Outfit', 'Outfit'], ['400 32px Geist', 'Geist']];
      return Promise.all(want.map(function (w) { return doc.fonts.load(w[0]); })).then(function (sets) {
        for (var i = 0; i < sets.length; i++) {
          var ok = sets[i].some(function (f) { return f.family.replace(/["']/g, '') === want[i][1] && f.status === 'loaded'; });
          if (!ok) return want[i][1] + ' did not load';
        }
        return '';
      });
    }
  },
  // Breaks if the web build still packs the shared Material icon, or if the Android app's icon changed.
  'icons-phosphor': {
    check: function () {
      var ANDROID_SETTINGS_SHA256 = '1f2105efab9a1df64fd0d4a14049ef842b694bececac94c34c5e1a23d7b87d1a';   // upstream 0e33f16
      function bytes(url) { return fetch(url, {cache: 'no-store'}).then(function (r) { return r.arrayBuffer(); }); }
      function hex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return (b < 16 ? '0' : '') + b.toString(16); }).join(''); }
      return Promise.all([bytes('/out/tizen/symbols/settings.png'), bytes('/app/assets/symbols/settings.png')]).then(function (b) {
        return crypto.subtle.digest('SHA-256', b[1]).then(function (androidHash) {
          if (hex(androidHash) !== ANDROID_SETTINGS_SHA256) return 'the Android settings icon changed';
          return crypto.subtle.digest('SHA-256', b[0]).then(function (webHash) {
            return hex(webHash) === ANDROID_SETTINGS_SHA256 ? 'the web build still packs the Material settings icon' : '';
          });
        });
      });
    }
  },
  'harness-loads': {
    check: function (win, doc) {
      return doc.body.classList.contains('no-picks') ? '' : 'body has no no-picks class: ' + doc.body.className;
    }
  }
};

function finish(text) { document.getElementById('result').textContent = text; }

(function run() {
  var c = CASES[CASE];
  if (!c) { finish('FAIL ' + CASE + ': unknown case'); return; }
  var go = function (fixture) {
    try { if (c.setup) c.setup(fixture); else seed({}, null); } catch (e) { finish('FAIL ' + CASE + ': setup ' + e); return; }
    var frame = document.createElement('iframe');
    frame.src = '/out/tizen/index.html';
    frame.onload = function () {
      setTimeout(function () {
        var report = function (why) { finish(why ? 'FAIL ' + CASE + ': ' + why : 'PASS ' + CASE); };
        var why;
        try { why = c.check(frame.contentWindow, frame.contentDocument); } catch (e) { report('check threw ' + e); return; }
        if (why && typeof why.then === 'function') why.then(report, function (e) { report('check rejected ' + e); });
        else report(why);
      }, c.wait || 1500);
    };
    document.body.appendChild(frame);
  };
  var x = new XMLHttpRequest();
  x.open('GET', 'weather-denver.json');
  x.onload = function () { go(JSON.parse(x.responseText)); };
  x.onerror = function () { finish('FAIL ' + CASE + ': fixture not loaded'); };
  x.send();
})();
</script>
