<!doctype html>
<meta charset="utf-8">
<title>Free My TV UI harness</title>
<style>html, body { margin: 0; } iframe { border: 0; width: 1920px; height: 1080px; display: block; }</style>
<pre id="result"></pre>
<script>
// One case per run (run.sh passes ?case=). Each case may seed localStorage (setup) before the real page loads in a
// same-origin iframe, then checks the page (check) and returns '' for a pass or the reason it failed.
var CASE = (location.search.match(/case=([a-z0-9-]+)/) || [])[1];
var DENVER = {latitude: 39.73915, longitude: -104.9847};

function pad(n) { return (n < 10 ? '0' : '') + n; }
/** Open-Meteo local time string for epoch ms at a fixed UTC offset (seconds). */
function meteoTime(ms, off) {
  var d = new Date(ms + off * 1000);
  return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()) + 'T' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes());
}
/** The Denver fixture with hourly times at now + 1h, + 2h, ... and today's sunrise and sunset at the given local times. */
function denverWeather(fixture, sunriseHM, sunsetHM) {
  var body = JSON.parse(JSON.stringify(fixture)), off = body.utc_offset_seconds;
  var hourMs = 3600000, now = Date.now(), top = Math.floor(now / hourMs) * hourMs;
  body.hourly.time = body.hourly.temperature_2m.map(function (_, k) { return meteoTime(top + (k + 1) * hourMs, off); });
  var today = meteoTime(now, off).slice(0, 10);
  body.daily.time = [today];
  body.daily.sunrise = [today + 'T' + (sunriseHM || '06:58')];
  body.daily.sunset = [today + 'T' + (sunsetHM || '16:40')];
  return body;
}
function seed(prefs, weatherBody) {
  localStorage.clear();
  var p = {latitude: DENVER.latitude, longitude: DENVER.longitude};
  for (var k in prefs) p[k] = prefs[k];
  localStorage.setItem('fmtv.prefs', JSON.stringify(p));
  if (weatherBody) {
    localStorage.setItem('fmtv.weather', JSON.stringify({place: DENVER.latitude + ',' + DENVER.longitude,
      body: weatherBody, at: Date.now(), query: null}));
  }
}

var CASES = {
  // Breaks if Outfit 300, Outfit 400 (the clock) or Geist 400 is not declared as a local @font-face the page can load.
  // The weight must match exactly: fonts.load() falls back to the nearest weight of the family.
  'fonts-loaded': {
    check: function (win, doc) {
      var want = [['300 96px Outfit', 'Outfit', '300'], ['400 160px Outfit', 'Outfit', '400'], ['400 32px Geist', 'Geist', '400']];
      return Promise.all(want.map(function (w) { return doc.fonts.load(w[0]); })).then(function (sets) {
        for (var i = 0; i < sets.length; i++) {
          var ok = sets[i].some(function (f) { return f.family.replace(/["']/g, '') === want[i][1] && f.weight === want[i][2] && f.status === 'loaded'; });
          if (!ok) return want[i][1] + ' ' + want[i][2] + ' did not load';
        }
        return '';
      });
    }
  },
  // Breaks if the web build still packs the shared Material icon, or if the Android app's icon changed.
  'icons-phosphor': {
    check: function () {
      var ANDROID_SETTINGS_SHA256 = '1f2105efab9a1df64fd0d4a14049ef842b694bececac94c34c5e1a23d7b87d1a';   // upstream 0e33f16
      function bytes(url) { return fetch(url, {cache: 'no-store'}).then(function (r) { return r.arrayBuffer(); }); }
      function hex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (b) { return (b < 16 ? '0' : '') + b.toString(16); }).join(''); }
      return Promise.all([bytes('/out/tizen/symbols/settings.png'), bytes('/app/assets/symbols/settings.png')]).then(function (b) {
        return crypto.subtle.digest('SHA-256', b[1]).then(function (androidHash) {
          if (hex(androidHash) !== ANDROID_SETTINGS_SHA256) return 'the Android settings icon changed';
          return crypto.subtle.digest('SHA-256', b[0]).then(function (webHash) {
            return hex(webHash) === ANDROID_SETTINGS_SHA256 ? 'the web build still packs the Material settings icon' : '';
          });
        });
      });
    }
  },
  // Breaks if the interface face is not Geist, if any of Apple's system greys survive in day or night mode, or if a
  // home screen shadow is plain black instead of the tinted slate.
  'palette': {
    check: function (win, doc) {
      var OLD = ['rgb(29, 29, 31)', 'rgb(245, 245, 247)', 'rgb(110, 110, 115)'];
      var family = win.getComputedStyle(doc.body).fontFamily.replace(/["']/g, '');
      if (family.indexOf('Geist') !== 0) return 'body font-family is ' + family;
      var modes = [true, false];
      for (var m = 0; m < modes.length; m++) {
        doc.body.classList.toggle('night', modes[m]);
        var all = doc.querySelectorAll('#stage, #stage *');
        for (var i = 0; i < all.length; i++) {
          var cs = win.getComputedStyle(all[i]);
          if (OLD.indexOf(cs.color) >= 0 || OLD.indexOf(cs.backgroundColor) >= 0) {
            return (modes[m] ? 'night' : 'day') + ': ' + (all[i].id || all[i].className || all[i].tagName) + ' uses ' + (OLD.indexOf(cs.color) >= 0 ? cs.color : cs.backgroundColor);
          }
          if (all[i].closest('#home') && cs.boxShadow.indexOf('rgba(0, 0, 0') >= 0) {
            return (modes[m] ? 'night' : 'day') + ': ' + (all[i].id || all[i].className) + ' has a black shadow';
          }
        }
      }
      return '';
    }
  },
  // Breaks if focus is still marked with a white fill instead of the amber accent, on the shelf or the top buttons.
  'focus-accent': {
    still: true,
    check: function (win, doc) {
      var AMBER = 'rgb(227, 161, 94)';
      press(win, doc, 39);
      return later(400).then(function () {
        var tile = doc.querySelector('#tiles .tile.focus');
        if (!tile) return 'no focused shelf tile after Right';
        if (tile !== doc.querySelectorAll('#tiles .tile')[1]) return 'Right did not focus the second tile';
        if (win.getComputedStyle(tile).boxShadow.indexOf(AMBER + ' 0px 0px 0px 3px') < 0) return 'focused tile has no 3 px amber ring: ' + win.getComputedStyle(tile).boxShadow;
        press(win, doc, 38);
        return later(400).then(function () {
          var round = doc.querySelector('.round.focus');
          if (!round) return 'no focused top button after Up';
          var bg = win.getComputedStyle(round).backgroundColor;
          return bg === AMBER ? '' : 'focused top button background is ' + bg;
        });
      });
    }
  },
  // Breaks if any readable or focusable part of the no-picks home screen leaves the 5% safe area (Android TV guide:
  // 48dp x 27dp at 960 x 540, so 96 x 54 px on the 1920 x 1080 stage), focused or not.
  'safe-margin': {
    still: true,
    setup: function (fixture) { seed({}, denverWeather(fixture)); },
    check: function (win, doc) {
      function shown(node) {
        var cs = win.getComputedStyle(node);
        return cs.display !== 'none' && cs.visibility !== 'hidden' && parseFloat(cs.opacity) > 0;
      }
      function outside(node, label) {
        var r = node.getBoundingClientRect();
        if (r.width === 0 && r.height === 0) return '';
        if (r.left < 96 || r.right > 1824 || r.top < 54 || r.bottom > 1026) {
          return label + ' at ' + [r.left, r.top, r.right, r.bottom].map(Math.round).join(',');
        }
        return '';
      }
      var groups = [['#clock', 'clock'], ['#weatherline', 'weather line'], ['#buttons > *', 'top button'],
        ['#tiles > *', 'shelf tile'], ['#tiles .label', 'shelf name'], ['#platter > *', 'shelf arrow']];
      function sweep() {
        for (var g = 0; g < groups.length; g++) {
          var nodes = doc.querySelectorAll(groups[g][0]);
          for (var i = 0; i < nodes.length; i++) {
            if (!shown(nodes[i])) continue;
            var why = outside(nodes[i], groups[g][1] + ' ' + i);
            if (why) return why;
          }
        }
        return '';
      }
      var first = sweep();
      if (first) return first;
      press(win, doc, 38);   // up to the top buttons: their focused size counts too
      return later(300).then(function () {
        var why = sweep();
        if (why) return 'with a top button focused: ' + why;
        press(win, doc, 39); press(win, doc, 39);
        return later(300).then(function () { var w = sweep(); return w ? 'with the last top button focused: ' + w : ''; });
      });
    }
  },
  // Weather line cases: Denver fixture in Celsius, English. Expected text derived by hand from the fixture:
  // now 41.2 -> "41°", code 3 -> "Cloudy"; hours +1, +2, +3 -> 38.4, 36.1, 35.0 -> "38°", "36°", "35°".
  // Breaks if the line is missing, leaves out the current reading, or shows the hours out of order.
  'weather-line': {
    setup: function (fixture) { seed({temperature: 'C', language: 'en'}, denverWeather(fixture)); },
    check: function (win, doc) {
      var line = doc.getElementById('weatherline');
      if (!line) return 'no #weatherline';
      if (win.getComputedStyle(line).display === 'none') return '#weatherline is hidden';
      var text = line.textContent, top = Math.floor(Date.now() / 3600000) * 3600000;
      function label(k) { var h = new Date(top + k * 3600000).getHours(); return (h % 12 || 12) + ' ' + (h < 12 ? 'AM' : 'PM'); }
      var want = ['41°', 'Cloudy', label(1), '38°', label(2), '36°', label(3), '35°'], at = 0;
      for (var i = 0; i < want.length; i++) {
        var found = text.indexOf(want[i], at);
        if (found < 0) return 'missing "' + want[i] + '" (in order) in "' + text + '"';
        at = found + want[i].length;
      }
      // Only three hours: the fourth (33.7 -> "34°") stays off the line.
      return text.indexOf('34°') < 0 ? '' : 'shows a fourth hour: "' + text + '"';
    }
  },
  // Breaks if the line shows (or the clock moves) when no weather was ever fetched.
  'weather-none': {
    still: true,
    setup: function () { seed({temperature: 'C', language: 'en'}, null); },
    check: function (win, doc) {
      var line = doc.getElementById('weatherline'), clock = doc.getElementById('clock').getBoundingClientRect();
      if (!line) return 'no #weatherline';
      if (win.getComputedStyle(line).display !== 'none') return '#weatherline shows without weather: "' + line.textContent + '"';
      return Math.round(clock.left) === 96 && Math.round(clock.top) === 54 ? '' : 'clock moved to ' + Math.round(clock.left) + ',' + Math.round(clock.top);
    }
  },
  // Breaks if the line ignores Home Settings' weather switch.
  'weather-off': {
    setup: function (fixture) { seed({temperature: 'C', language: 'en', weather: false}, denverWeather(fixture)); },
    check: function (win, doc) {
      var line = doc.getElementById('weatherline');
      if (!line) return 'no #weatherline';
      return win.getComputedStyle(line).display === 'none' ? '' : '#weatherline shows with weather off';
    }
  },
  // Breaks if the backdrop is not the Front Range photo for the current sun phase, or if that photo did not load.
  'backdrop-photo': {
    setup: function (fixture) { seed({temperature: 'C', language: 'en'}, denverWeather(fixture)); },
    check: function (win, doc) {
      var img = doc.getElementById('horizon');
      if (!img || img.tagName !== 'IMG') return '#horizon is not an image';
      var phase = img.getAttribute('data-phase');
      if (['night', 'dawn', 'day', 'dusk'].indexOf(phase) < 0) return 'data-phase is ' + phase;
      if (!/photos\/(night|dawn|day|dusk)\.jpg$/.test(img.src) || img.src.indexOf('photos/' + phase + '.jpg') < 0) return 'src ' + img.src + ' for phase ' + phase;
      if (win.getComputedStyle(img).display === 'none') return 'the photo is hidden';
      return img.complete && img.naturalWidth === 1920 ? '' : 'photo not loaded (naturalWidth ' + img.naturalWidth + ')';
    }
  },
  // Breaks if a photo that fails to load leaves a broken image instead of the plain sky.
  'backdrop-fallback': {
    check: function (win, doc) {
      var img = doc.getElementById('horizon');
      if (!img || img.tagName !== 'IMG') return '#horizon is not an image';
      // First a working photo, so a page that never set one up cannot pass by looking hidden.
      if (!img.getAttribute('data-phase') || win.getComputedStyle(img).display === 'none') return 'no photo showed before the failure';
      img.src = 'photos/missing-' + Date.now() + '.jpg';
      return later(800).then(function () {
        if (win.getComputedStyle(img).display !== 'none') return 'a failed photo still shows';
        var grads = doc.querySelectorAll('#sky .grad'), shown = 0;
        for (var i = 0; i < grads.length; i++) if (parseFloat(win.getComputedStyle(grads[i]).opacity) > 0) shown++;
        return shown ? '' : 'no sky gradient shows behind the failed photo';
      });
    }
  },
  // Breaks if the focused app shows no name, if an unfocused one does, if the focused tile does not grow to 1.08 or the
  // one left behind stays grown, or if focusing moves its neighbours.
  'shelf-focus': {
    still: true,
    check: function (win, doc) {
      var tiles = doc.querySelectorAll('#tiles .tile');
      if (tiles.length < 3) return 'fewer than 3 shelf tiles';
      function label(t) { return t.querySelector('.label'); }
      function seen(t) { var l = label(t); return l ? parseFloat(win.getComputedStyle(l).opacity) : -1; }
      var thirdLeft = tiles[2].getBoundingClientRect().left;
      press(win, doc, 39);
      return later(300).then(function () {
        if (!label(tiles[1])) return 'tile 1 has no name label';
        if (label(tiles[1]).textContent.trim() === '') return 'tile 1 label is empty';
        if (seen(tiles[1]) !== 1) return 'focused tile 1 name opacity ' + seen(tiles[1]);
        if (seen(tiles[0]) !== 0) return 'unfocused tile 0 name opacity ' + seen(tiles[0]);
        function scale(t) { var m = /^matrix\(([^,]+),/.exec(win.getComputedStyle(t).transform); return m ? parseFloat(m[1]) : 1; }
        if (Math.abs(scale(tiles[1]) - 1.08) > 0.001) return 'focused tile 1 scale ' + scale(tiles[1]);
        if (Math.abs(scale(tiles[0]) - 1) > 0.001) return 'unfocused tile 0 scale ' + scale(tiles[0]);
        var moved = tiles[2].getBoundingClientRect().left - thirdLeft;
        return Math.abs(moved) < 0.5 ? '' : 'tile 2 moved ' + moved + ' px';
      });
    }
  },
  // Type steps (Decision 17): breaks if the clock, date or focused name leaves its size, or if any home text drops under
  // 29 px (spec: Type reads from the couch).
  'type-scale': {
    still: true,
    setup: function (fixture) { seed({}, denverWeather(fixture)); },
    check: function (win, doc) {
      function size(n) { return parseFloat(win.getComputedStyle(n).fontSize); }
      var clock = doc.querySelector('#clock'), date = doc.querySelector('#clock .date'), label = doc.querySelector('#tiles .tile .label');
      if (!clock || !date || !label) return 'clock, date or shelf name missing';
      if (size(clock) !== 160 || win.getComputedStyle(clock).fontWeight !== '400') return 'clock ' + size(clock) + ' px weight ' + win.getComputedStyle(clock).fontWeight;
      if (size(date) !== 38) return 'date ' + size(date) + ' px';
      if (size(label) !== 30) return 'shelf name ' + size(label) + ' px';
      var all = doc.querySelectorAll('#clock, #clock *, #weatherline, #weatherline *, #tiles .tile .label');
      for (var i = 0; i < all.length; i++) {
        if (all[i].textContent.trim() && size(all[i]) < 29) return (all[i].id || all[i].className) + ' is ' + size(all[i]) + ' px';
      }
      return '';
    }
  },
  // Breaks if the hours share a line with the current reading (Decision 17: now over the hours).
  'weather-two-lines': {
    still: true,
    setup: function (fixture) { seed({}, denverWeather(fixture)); },
    check: function (win, doc) {
      var now = doc.querySelector('#weatherline .now'), hour = doc.querySelector('#weatherline .hour');
      if (!now || !hour) return 'weather line has no current reading or no hours';
      var a = now.getBoundingClientRect(), b = hour.getBoundingClientRect();
      return b.top >= a.bottom - 1 ? '' : 'first hour at y ' + Math.round(b.top) + ' is beside the current reading (bottom ' + Math.round(a.bottom) + ')';
    }
  },
  // Tile depth (Decision 18): breaks if the focused logo does not lift 4 px with a drop shadow, if the logo left behind
  // stays lifted, if the focused tile has no elevation shadow, or if any tile loses its top-edge highlight.
  'tile-depth': {
    still: true,
    check: function (win, doc) {
      var tiles = doc.querySelectorAll('#tiles .tile');
      if (tiles.length < 2) return 'fewer than 2 shelf tiles';
      function ty(t) { var i = t.querySelector('img'); if (!i) return null; var m = /^matrix\(([^)]+)\)/.exec(win.getComputedStyle(i).transform); return m ? parseFloat(m[1].split(',')[5]) : 0; }
      var rest1 = ty(tiles[1]);
      if (rest1 === null) return 'tile 1 has no logo';
      press(win, doc, 39);
      return later(400).then(function () {
        var lift = ty(tiles[1]) - rest1;
        if (Math.abs(lift + 4) > 0.5) return 'focused logo moved ' + lift + ' px, want -4';
        if (win.getComputedStyle(tiles[1].querySelector('img')).filter.indexOf('drop-shadow') < 0) return 'focused logo has no drop shadow';
        var t0 = tiles[0].querySelector('img');
        if (t0 && win.getComputedStyle(t0).filter.indexOf('drop-shadow') >= 0) return 'tile 0 logo keeps its drop shadow';
        if (win.getComputedStyle(tiles[1]).boxShadow.indexOf('rgba(6, 10, 16, 0.45) 0px 24px 48px') < 0) return 'focused tile has no elevation shadow: ' + win.getComputedStyle(tiles[1]).boxShadow;
        for (var i = 0; i < tiles.length; i++) {
          if (i === 1) continue;
          if (win.getComputedStyle(tiles[i]).boxShadow.indexOf('rgba(255, 255, 255, 0.08) 0px 1px 0px 0px inset') < 0) return 'tile ' + i + ' has no top-edge highlight';
        }
        return '';
      });
    }
  },
  // Breaks if the shelf shows other than six tiles at once, if a tile is not 240 px wide, or if tiles differ in surface
  // colour (a brand gradient back on the shelf) (Decision 16).
  'tiles-surface': {
    still: true,
    check: function (win, doc) {
      var tiles = doc.querySelectorAll('#tiles .tile'), shown = [];
      for (var i = 0; i < tiles.length; i++) {
        var r = tiles[i].getBoundingClientRect();
        if (parseFloat(win.getComputedStyle(tiles[i]).opacity) > 0 && r.left >= 96 && r.right <= 1824) shown.push(tiles[i]);
      }
      if (shown.length !== 6) return shown.length + ' tiles shown, want 6';
      var bg = win.getComputedStyle(shown[0]).backgroundColor, img = win.getComputedStyle(shown[0]).backgroundImage;
      if (bg === 'rgba(0, 0, 0, 0)') return 'tile 0 has no surface colour';
      for (var j = 0; j < shown.length; j++) {
        if (shown[j].offsetWidth !== 240) return 'tile ' + j + ' is ' + shown[j].offsetWidth + ' px wide';
        var cs = win.getComputedStyle(shown[j]);
        if (cs.backgroundColor !== bg || cs.backgroundImage !== img) return 'tile ' + j + ' surface ' + cs.backgroundColor + ' ' + cs.backgroundImage + ' differs from tile 0';
      }
      return '';
    }
  },
  // Breaks if a shelf app with a bundled white logo shows anything else (its word, a brand icon), or if an app with no
  // logo loses its name (Decision 16: our white logo, else the app's icon, else its name in white).
  'tiles-mono': {
    check: function (win, doc) {
      var tiles = doc.querySelectorAll('#tiles .tile'), netflix = null, disney = null;
      for (var i = 0; i < tiles.length; i++) {
        var name = tiles[i].querySelector('.label').textContent.trim();
        if (name === 'Netflix') netflix = tiles[i];
        if (name === 'Disney+') disney = tiles[i];
      }
      if (!netflix || !disney) return 'Netflix or Disney+ is not on the shelf';
      var img = netflix.querySelector('img');
      if (!img || !/icons\/mono\/netflix\.svg$/.test(img.getAttribute('src') || '')) return 'Netflix tile shows ' + (img ? img.getAttribute('src') : 'no logo');
      if (disney.querySelector('img')) return 'Disney+ tile has an image';
      var word = disney.querySelector('.word');
      if (!word || win.getComputedStyle(word).visibility === 'hidden' || word.textContent.trim() !== 'Disney+') return 'Disney+ tile shows no name';
      return '';
    }
  },
  // Motion inventory (transform and opacity only, never layout or colour): breaks if the clock, weather line or shelf
  // has no entrance, if that entrance animates anything else, or if any of them or the horizon transitions anything else.
  'motion-props': {
    setup: function (fixture) { seed({temperature: 'C', language: 'en'}, denverWeather(fixture)); },
    check: function (win, doc) {
      var ALLOWED = ['transform', '-webkit-transform', 'opacity'];
      function frames(name) {
        for (var s = 0; s < doc.styleSheets.length; s++) {
          var rules = doc.styleSheets[s].cssRules;
          for (var r = 0; r < rules.length; r++) {
            if ((rules[r].type === 7) && rules[r].name === name) return rules[r];
          }
        }
        return null;
      }
      var ids = ['clock', 'weatherline', 'tiles'];
      for (var i = 0; i < ids.length; i++) {
        var cs = win.getComputedStyle(doc.getElementById(ids[i]));
        if (!cs.animationName || cs.animationName === 'none') return '#' + ids[i] + ' has no entrance animation';
        var kf = frames(cs.animationName);
        if (!kf) return 'no @keyframes ' + cs.animationName;
        for (var k = 0; k < kf.cssRules.length; k++) {
          var st = kf.cssRules[k].style;
          for (var j = 0; j < st.length; j++) {
            if (ALLOWED.indexOf(st[j]) < 0) return '@keyframes ' + cs.animationName + ' animates ' + st[j];
          }
        }
      }
      ids.push('horizon');
      for (var m = 0; m < ids.length; m++) {
        var tcs = win.getComputedStyle(doc.getElementById(ids[m]));
        var props = tcs.transitionProperty.split(/,\s*/), times = tcs.transitionDuration.split(/,\s*/);
        for (var n = 0; n < props.length; n++) {
          var lasts = parseFloat(times[n % times.length]) > 0;   // a 0s entry (the default "all 0s") animates nothing
          if (lasts && ALLOWED.indexOf(props[n]) < 0) return '#' + ids[m] + ' transitions ' + props[n];
        }
      }
      return '';
    }
  },
  // Kept behaviour: breaks if crypto prices show on the home screen while turned off.
  'crypto-off': {
    setup: function (fixture) { seed({quotes: false}, denverWeather(fixture)); },
    check: function (win, doc) {
      var q = doc.getElementById('quotes'), cs = win.getComputedStyle(q);
      var hidden = cs.display === 'none' || cs.visibility === 'hidden' || parseFloat(cs.opacity) === 0;
      return hidden || q.textContent.trim() === '' ? '' : 'prices show with crypto off: "' + q.textContent.trim() + '"';
    }
  },
  // Kept behaviour: breaks if Down on the shelf no longer opens the drawer.
  'drawer-opens': {
    still: true,
    check: function (win, doc) {
      if (!doc.querySelector('#tiles .tile.focus')) return 'the shelf does not have focus at start';
      press(win, doc, 40);
      return later(300).then(function () {
        return doc.body.classList.contains('drawer-open') ? '' : 'Down on the shelf did not open the drawer';
      });
    }
  },
  'harness-loads': {
    check: function (win, doc) {
      return doc.body.classList.contains('no-picks') ? '' : 'body has no no-picks class: ' + doc.body.className;
    }
  }
};

/** A remote key press as the page reads it (keydown with keyCode): 37 left, 38 up, 39 right, 40 down. */
function press(win, doc, keyCode) {
  var e = doc.createEvent('Event');
  e.initEvent('keydown', true, true);
  Object.defineProperty(e, 'keyCode', {get: function () { return keyCode; }});
  Object.defineProperty(e, 'which', {get: function () { return keyCode; }});
  doc.dispatchEvent(e);
}
function later(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

function finish(text) { document.getElementById('result').textContent = text; }

(function run() {
  var c = CASES[CASE];
  if (!c) { finish('FAIL ' + CASE + ': unknown case'); return; }
  var go = function (fixture) {
